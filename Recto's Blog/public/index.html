<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
   

    .avatar-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 40px auto;
    }

    .avatar-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid #ff7da1;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.06);
      box-shadow: 0 0 18px rgba(255, 125, 161, 0.7);
      border-color: #ff5d8c;
    }

    .icons-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 260px;
      height: 260px;
      animation: rotateIcons 30s linear infinite;
      transform-origin: center center;
      z-index: 5;
      pointer-events: none;
    }

    .icons-container a {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease;
      pointer-events: auto;
    }

    .icons-container a img {
      width: 100%;
      height: 100%;
      filter: grayscale(80%);
      transition: filter 0.3s ease, transform 0.3s ease;
      animation: counterRotate 30s linear infinite;
    }

    .icons-container a:hover img {
      filter: none;
      transform: scale(1.2);
    }

    @keyframes rotateIcons {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes counterRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    .section-title {
      text-align: center;
      margin-top: 40px;
    }

    .footer-call {
      text-align: center;
      margin: 60px 0 30px;
    }

    .footer-call a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background-color: #ff7da1;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .footer-call a:hover {
      background-color: #ff5d8c;
    }
  </style>
</head>
<body>
  <header>
  <h1>🥥 Recto's Blog 🥥</h1>
</header>

<nav class="main-nav">
  <a href="/index.html" class="nav-link active">首页</a>
  <a href="/articles.html" class="nav-link">博客</a>
  <a href="/about.html" class="nav-link">关于我</a>
  <a href="/guestbook.html" class="nav-link">留言板</a>
</nav>

  <main class="container">
    <div class="avatar-wrapper">
      <div class="avatar-container">
        <img class="avatar" src="/images/avatar.jpg" alt="Avatar" onclick="location.href='/about.html'" />
      </div>
      <div id="iconsContainer" class="icons-container"></div>
    </div>

    <h2 class="section-title">推荐文章</h2>
    <div id="recommendations" class="articles-list">
      <p>⏳ 加载中...</p>
    </div>

    <a href="/articles.html" class="more-button">查看更多文章</a>

    <div class="footer-call">
      <p>💌 想说点什么？欢迎来留言板看看！</p>
      <a href="/guestbook.html">前往留言板</a>
    </div>
  </main>

  <script>
    const socialLinks = [
      { icon: 'github.png', link: 'https://github.com/RectoLn' },
      { icon: 'bilibili.png', link: 'https://space.bilibili.com/512551013' },
      { icon: 'zhihu.png', link: 'https://www.zhihu.com/people/lin-zi-yue-66-34' },
      { icon: 'notion.png', link: 'https://faint-haumea-a9c.notion.site/Recto-Ln-1bcba137e50e44509a6df68e9c5f977d' },
      { icon: 'email.png', link: 'mailto:RectoLn@outlook.com' },
      { icon: 'xiaohongshu.png', link: 'https://www.xiaohongshu.com/user/profile/6489986c0000000010034a92' }
    ];

    const container = document.getElementById('iconsContainer');
    const radius = 150;
    const centerX = 130;
    const centerY = 130;

    socialLinks.forEach((item, index) => {
      const angle = (2 * Math.PI / socialLinks.length) * index;
      const x = centerX + radius * Math.cos(angle);
      const y = centerY + radius * Math.sin(angle);

      const a = document.createElement('a');
      a.href = item.link;
      a.target = "_blank";
      a.style.left = `${x}px`;
      a.style.top = `${y}px`;

      const img = document.createElement('img');
      img.src = `/images/icons/${item.icon}`;
      img.alt = "icon";
      a.appendChild(img);
      container.appendChild(a);
    });

    async function loadRecommended() {
      const container = document.getElementById('recommendations');
      try {
        const res = await fetch('/api/posts');
        let posts = await res.json();

        if (!Array.isArray(posts) || posts.length === 0) {
          container.innerHTML = '<p>暂无推荐文章</p>';
          return;
        }

        posts = posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 3);
        container.innerHTML = '';

        posts.forEach(post => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `/post.html?id=${post._id}`;
          card.innerHTML = `
            <img src="${post.coverImage}" alt="封面图" />
            <div class="card-content">
              <h3 class="card-title">${post.title}</h3>
              <p class="card-date">${new Date(post.createdAt).toLocaleDateString()}</p>
              <p class="card-summary">${post.summary}</p>
              <p class="card-category"><em>分类: ${post.category || '未分类'}</em></p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p>❌ 加载失败，请稍后重试</p>';
      }
    }

    loadRecommended();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>留言板 - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    textarea, input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #ff7da1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff5d8c;
    }
    .message {
      background: #fff;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
 <header>
  <h1>🥥 Recto's Blog 🥥</h1>
</header>

<nav class="main-nav">
  <a href="/index.html" class="nav-link">首页</a>
  <a href="/articles.html" class="nav-link">博客</a>
  <a href="/about.html" class="nav-link">关于我</a>
  <a href="/guestbook.html" class="nav-link active">留言板</a>
</nav>


  <div class="container">
    <h2>📬 留个言吧</h2>
    <input type="text" id="name" placeholder="你的名字（可留空）" />
    <textarea id="message" rows="5" placeholder="说点什么..."></textarea>
    <button id="submitBtn">提交</button>

    <div id="messages">
      <p>加载中...</p>
    </div>
  </div>

<script>
  const messagesDiv = document.getElementById('messages');
  const submitBtn = document.getElementById('submitBtn');

  async function fetchMessages() {
    messagesDiv.innerHTML = '<p>加载中...</p>';
    try {
      const res = await fetch('/api/messages');
      const data = await res.json();
      if (data.length === 0) {
        messagesDiv.innerHTML = '<p>暂无留言</p>';
        return;
      }
      messagesDiv.innerHTML = '';
      data.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message';
        const date = new Date(msg.createdAt).toLocaleString();
        div.innerHTML = `<strong>${msg.name}</strong> <em style="color:#aaa;font-size:0.9rem;">${date}</em><br>${msg.content}`;
        messagesDiv.appendChild(div);
      });
    } catch (err) {
      messagesDiv.innerHTML = '<p>加载留言失败</p>';
      console.error(err);
    }
  }

  async function submitMessage() {
    const name = document.getElementById('name').value.trim();
    const content = document.getElementById('message').value.trim();
    if (!content) {
      alert('请输入留言内容');
      return;
    }
    try {
      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, content }),
      });
      if (!res.ok) {
        const errData = await res.json();
        alert('提交失败：' + errData.error);
        return;
      }
      document.getElementById('name').value = '';
      document.getElementById('message').value = '';
      fetchMessages();
    } catch (err) {
      alert('提交失败，请稍后重试');
      console.error(err);
    }
  }

  submitBtn.addEventListener('click', submitMessage);
  window.onload = fetchMessages;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 音乐播放器样式 */
    .music-player {
      display: none;
    }
    
    /* 修改后的标语样式 - 取消斜体和音符 */
    .slogan {
      margin-top: -10px; /* 增加上边距 */
      font-size: 1.2rem;
      color: #ff7da1;
      letter-spacing: 1px;
      opacity: 0.9;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    
    .slogan:hover {
      opacity: 1;
      text-shadow: 0 0 5px rgba(255, 125, 161, 0.3);
    }
    
    /* 头像区域整体下移 */
    .avatar-wrapper {
      position: relative;
      width: 300px;
      height: 380px; /* 增加高度 */
      margin: 60px auto 30px; /* 增加上边距，减少下边距 */
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* 波纹容器微调 */
    .avatar-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 80px; /* 增加下边距 */
      z-index: 10;
    }
    
    /* 保持其他原有样式 */
    .ripple {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255, 125, 161, 0.3);
      animation: ripple 3s infinite;
      opacity: 0;
      pointer-events: none;
    }
    
    @keyframes ripple {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
    
    .ripple:nth-child(2) {
      animation-delay: 0.5s;
    }
    .ripple:nth-child(3) {
      animation-delay: 1s;
    }
    
    .avatar-container:hover .ripple {
      animation-duration: 2s;
      border-width: 3px;
      border-color: rgba(255, 125, 161, 0.6);
    }
    
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid #ff7da1;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      background-color: white;
      box-shadow: 0 0 0 rgba(255, 125, 161, 0);
    }
    
    .avatar:hover {
      transform: scale(1.06);
      box-shadow: 0 0 18px rgba(255, 125, 161, 0.7);
      border-color: #ff5d8c;
    }
    
    .section-title {
      text-align: center;
      margin-top: 30px; /* 减少上边距 */
    }
    
    /* 其他样式保持不变 */
    .footer-call {
      text-align: center;
      margin-top: 30px;
    }
    
    .button-group {
      display: inline-flex;
      gap: 25px;
    }
    
    .footer-call a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background-color: #fe608d;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    
    .footer-call a:hover {
      background-color: #ff4c7f;
    }
    
    @media (max-width: 768px) {
      .ripple {
        display: none;
      }
      
      .avatar-wrapper {
        margin: 40px auto 20px;
        height: 350px;
      }
      
      .articles-list {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
    
      .card {
        flex-direction: column;
        width: 92%;
        max-width: 100%;
        padding-bottom: 10px;
      }
    
      .card img {
        width: 100%;
        height: 160px;
        border-radius: 16px 16px 0 0;
      }
    
      .card-content {
        padding: 12px 14px;
      }
    
      .card-title {
        font-size: 1.15em;
        margin-bottom: 6px;
      }
    
      .card-summary {
        font-size: 0.95em;
        color: #555;
      }
    
      .card-date,
      .card-category {
        font-size: 0.8em;
      }
    }
    
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px 0 0 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥥 Recto's Blog 🥥</h1>
  </header>

  <nav class="main-nav">
    <a href="/index.html" class="nav-link active">首页</a>
    <a href="/articles.html" class="nav-link">博客</a>
    <a href="/about.html" class="nav-link">关于</a>
    <a href="/guestbook.html" class="nav-link">留言</a>
  </nav>

  <main class="container">
    <audio id="bgMusic" class="music-player">
      <source src="/lifehack.mp3" type="audio/mpeg">
      您的浏览器不支持音频元素。
    </audio>

    <div class="avatar-wrapper">
      <div class="avatar-container">
        <img class="avatar" src="/images/avatar.jpg" alt="Avatar" onclick="location.href='/about.html'" />
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
      </div>
      <div class="slogan" id="musicSlogan">「愛とかノンフィクション。」</div>
    </div>

    <h2 class="section-title">Newest Blog</h2>
    <div id="recommendations" class="articles-list">
      <p>⏳ 加载中...</p>
    </div>

    <div class="footer-call">
      <div class="button-group">
        <a href="/articles.html" class="more-button">更多博客</a>
        <a href="/guestbook.html" class="more-button">前往留言</a>
      </div>
    </div>
  </main>

  <script>
    const musicPlayer = document.getElementById('bgMusic');
    const musicSlogan = document.getElementById('musicSlogan');
    let isPlaying = false;

    musicSlogan.addEventListener('click', function() {
      if (isPlaying) {
        musicPlayer.pause();
        musicPlayer.currentTime = 0;
        isPlaying = false;
        musicSlogan.style.textShadow = 'none';
      } else {
        musicPlayer.play()
          .then(() => {
            isPlaying = true;
            musicSlogan.style.textShadow = '0 0 8px rgba(255, 125, 161, 0.5)';
          })
          .catch(error => {
            console.error('播放失败:', error);
          });
      }
    });

    musicPlayer.addEventListener('ended', function() {
      isPlaying = false;
      musicSlogan.style.textShadow = 'none';
    });

    async function loadRecommended() {
      const container = document.getElementById('recommendations');
      try {
        const res = await fetch('/api/posts');
        let posts = await res.json();

        if (!Array.isArray(posts) || posts.length === 0) {
          container.innerHTML = '<p>暂无推荐文章</p>';
          return;
        }

        posts = posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 3);
        container.innerHTML = '';

        posts.forEach(post => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `/post.html?id=${post._id}`;
          card.innerHTML = `
            <img src="${post.coverImage}" alt="封面图" />
            <div class="card-content">
              <h3 class="card-title">${post.title}</h3>
              <p class="card-date">${new Date(post.createdAt).toLocaleDateString()}</p>
              <p class="card-summary">${post.summary}</p>
              <p class="card-category"><em>分类: ${post.category || '未分类'}</em></p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p>❌ 加载失败，请稍后重试</p>';
      }
    }

    loadRecommended();
  </script>
</body>
</html>

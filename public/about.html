<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .avatar-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 30px auto;
    }

    .avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #ff7da1;
      transform: translate(-50%, -50%);
      z-index: 10;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .icons-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: rotateIcons 30s linear infinite;
      transform-origin: center center;
      z-index: 5;
    }

    .icons-container a {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
    }

    .icons-container a img {
      width: 100%;
      height: 100%;
      filter: grayscale(80%) brightness(1.1);
      transition: all 0.3s ease;
      animation: counterRotate 30s linear infinite;
    }

    .icons-container a:hover {
      transform: translate(-50%, -50%) scale(1.2);
    }
    
    .icons-container a:hover img {
      filter: none;
    }

    @keyframes rotateIcons {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes counterRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .about-content {
      margin: 30px auto;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #444;
      text-align: center;
      padding: 0 20px;
    }
    
    .playground {
      margin: 40px 0;
      text-align: center;
    }
    
    .playground h2 {
      color: #ff7da1;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    
    .playground-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }
    
    .playground-link {
      padding: 12px 25px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      text-decoration: none;
      color: #ff7da1;
      font-weight: 500;
      border: 1px solid rgba(0,0,0,0.05);
    }
    
    .playground-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      color: #e14471eb;
    }

    .update-log {
      margin: 50px auto;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 10px;
      max-width: 600px;
    }
    
    .update-log h2 {
      text-align: center;
      color: #ff7da1;
      margin-bottom: 20px;
      font-size: 1.3rem;
    }
    
    /* 更新日志表格样式 */
  .log-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 auto;
    font-size: 0.95rem;
    border: 1px solid #e0e0e0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  
  .log-table th, 
  .log-table td {
    padding: 12px 15px;
    border: 1px solid #e0e0e0;
  }
  
  /* 表头居中 */
  .log-table th {
    background-color: #ff7da1;
    color: white;
    font-weight: 500;
    text-align: center;
  }
  
  /* 设置Date列宽度并居中 */
  .log-table th:first-child,
  .log-table td:first-child {
    width: 25%; /* 调整Date列的宽度 */
    min-width: 120px; /* 设置最小宽度确保日期不换行 */
    text-align: center; /* Date列内容居中 */
  }
  
  /* Update列保持左对齐 */
  .log-table td:last-child {
    text-align: left;
  }
  
  .log-table tr:nth-child(even) {
    background-color: #fcfcfc;
  }
  
  .log-table tr:hover {
    background-color: #f5f5f5;
  }
  
  /* 移动端表格优化 */
  @media (max-width: 768px) {
    .log-table {
      font-size: 0.9rem;
    }
    
    .log-table th, 
    .log-table td {
      padding: 10px 8px;
    }
    
    /* 移动端减小Date列宽度 */
    .log-table th:first-child,
    .log-table td:first-child {
      width: 30%;
      min-width: 100px;
    }
  }

    /* 加载状态样式 */
    .loading-row td {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    
    .error-row td {
      text-align: center;
      padding: 20px;
      color: #e74c3c;
    }
    
    /* 仅针对移动端的优化 */
    @media (max-width: 768px) {
      /* 头像区域优化 */
      .avatar-wrapper {
        width: 220px;
        height: 220px;
      }
      
      .avatar {
        width: 130px;
        height: 130px;
      }
      
      /* 调整图标容器大小和位置 */
      .icons-container a {
        width: 32px;
        height: 32px;
      }
      
      /* 调整图标半径 */
      #iconsContainer {
        --radius: 100px;
      }
      
      /* 内容区域优化 */
      .about-content {
        font-size: 1rem;
        padding: 0 15px;
      }
      
      /* 按钮区域优化 */
      .playground-links {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      
      .playground-link {
        width: 80%;
        max-width: 280px;
        text-align: center;
        padding: 12px 20px;
      }
      
      /* 更新日志优化 */
      .update-log {
        padding: 20px 15px;
        margin: 40px auto;
      }
      
      /* 表格移动端优化 */
      .log-table {
        font-size: 0.9rem;
      }
      
      .log-table th, 
      .log-table td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🥥 Recto's Blog 🥥</h1>
  </header>

  <nav class="main-nav">
    <a href="/index.html" class="nav-link">首页</a>
    <a href="/articles.html" class="nav-link">博客</a>
    <a href="/about.html" class="nav-link active">关于</a>
    <a href="/guestbook.html" class="nav-link">留言</a>
  </nav>

  <main class="container">
    <div class="avatar-wrapper">
      <img class="avatar" src="/images/avatar.jpg" alt="Recto's avatar" />
      <div id="iconsContainer" class="icons-container"></div>
    </div>

    <div class="about-content">
      <p>When not wrestling with datasets, you'll find me tinkering with new tech experiments or lost in the rhythm of music.</p>
    </div>
    
    <section class="playground">
      <div class="playground-links">
        <a href="/articles.html" class="playground-link">Blog: Record my life thoughts and ideas</a>
        <a href="/guestbook.html" class="playground-link">Guestbook: Leave your footprints here</a>
      </div>
    </section>

    <section class="update-log">
      <h2>Update Log</h2>
      <table class="log-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr class="loading-row">
            <td colspan="2">⏳ Loading updates...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const socialLinks = [
      { icon: 'github.png', link: 'https://github.com/RectoLn' },
      { icon: 'bilibili.png', link: 'https://space.bilibili.com/512551013' },
      { icon: 'zhihu.png', link: 'https://www.zhihu.com/people/lin-zi-yue-66-34' },
      { icon: 'notion.png', link: 'https://faint-haumea-a9c.notion.site/Recto-Ln-1bcba137e50e44509a6df68e9c5f977d' },
      { icon: 'email.png', link: 'mailto:RectoLn@outlook.com' },
      { icon: 'xiaohongshu.png', link: 'https://www.xiaohongshu.com/user/profile/6489986c0000000010034a92' }
    ];

    const container = document.getElementById('iconsContainer');
    // 使用CSS变量控制半径，便于媒体查询调整
    const radius = window.innerWidth <= 768 ? 100 : 135;
    const centerX = window.innerWidth <= 768 ? 110 : 130;
    const centerY = window.innerWidth <= 768 ? 110 : 130;

    socialLinks.forEach((item, index) => {
      const angle = (2 * Math.PI / socialLinks.length) * index;
      const x = centerX + radius * Math.cos(angle);
      const y = centerY + radius * Math.sin(angle);

      const a = document.createElement('a');
      a.href = item.link;
      a.target = "_blank";
      a.style.left = `${x}px`;
      a.style.top = `${y}px`;

      const img = document.createElement('img');
      img.src = `/images/icons/${item.icon}`;
      img.alt = item.icon.split('.')[0];
      a.appendChild(img);
      container.appendChild(a);
    });

    // 窗口大小改变时重新计算图标位置
    window.addEventListener('resize', function() {
      const links = document.querySelectorAll('.icons-container a');
      const newRadius = window.innerWidth <= 768 ? 100 : 135;
      const newCenterX = window.innerWidth <= 768 ? 110 : 130;
      const newCenterY = window.innerWidth <= 768 ? 110 : 130;
      
      links.forEach((link, index) => {
        const angle = (2 * Math.PI / links.length) * index;
        const x = newCenterX + newRadius * Math.cos(angle);
        const y = newCenterY + newRadius * Math.sin(angle);
        link.style.left = `${x}px`;
        link.style.top = `${y}px`;
      });
    });

    async function loadUpdateLog() {
      const tableBody = document.getElementById('logTableBody');
      try {
        const res = await fetch('/api/logs');
        const logs = await res.json();
        tableBody.innerHTML = '';
        
        if (logs.length === 0) {
          tableBody.innerHTML = `
            <tr class="loading-row">
              <td colspan="2">No updates yet</td>
            </tr>
          `;
          return;
        }
        
        logs.forEach(log => {
          const d = new Date(log.date);
          const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${dateStr}</strong></td>
            <td>${log.content}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        tableBody.innerHTML = `
          <tr class="error-row">
            <td colspan="2">❌ Failed to load updates</td>
          </tr>
        `;
        console.error('Update log error:', err);
      }
    }

    loadUpdateLog();
  </script>
</body>
</html>

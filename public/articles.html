<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章汇总 - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* ==================== 公共导航按钮样式 ==================== */
    /* 分类导航：水平居中排列，按钮带圆角边框，悬停/激活状态有颜色反馈 */
    nav.category-nav{
      display: flex; /* 弹性布局实现水平排列 */
      justify-content: center; /* 水平居中 */
      gap: 5px; /* 按钮间极小间隙 */
      margin-bottom: 30px; /* 与下方内容保持距离 */
      font-size: 0.85rem; /* 较小字体 */
      color: #999; /* 浅灰色文字 */
      background: transparent; /* 透明背景 */
      border: none; /* 无边框 */
      padding: 0; /* 无内边距 */
      border-top: none; /* 顶部无边框 */
      border-bottom: none; /* 底部无边框 */
      box-shadow: none; /* 无阴影 */
    }
    /* 排序导航：与分类导航样式一致，控制间距 */
    nav.sort-nav {
      display: flex;
      justify-content: center;
      gap: 16px; /* 按钮间较大间隙 */
      margin-bottom: 30px;
      font-size: 0.85rem;
      color: #999;
      background: transparent;
      border: none;
      padding: 0;
      border-top: none;
      border-bottom: none;
      box-shadow: none;
    }

    /* 导航按钮通用样式：背景色、边框、圆角、过渡效果 */
    nav.category-nav button,
    nav.sort-nav button {
      background: #fff7f9; /* 浅粉色背景 */
      border: 1.5px solid #ffccd7; /* 粉色边框 */
      color: #cc6677; /* 粉色文字 */
      padding: 6px 12px; /* 内边距 */
      font-size: 0.85rem; /* 字体大小 */
      border-radius: 16px; /* 圆角 */
      cursor: pointer; /* 鼠标指针变为手型 */
      transition: all 0.3s ease; /* 所有属性过渡动画 */
      font-weight: 500; /* 中等字重 */
    }
    /* 按钮悬停状态：背景色变深，文字颜色变浅，边框颜色变深 */
    nav.category-nav button:hover,
    nav.sort-nav button:hover {
      background-color: #ffe6ed;
      color: #aa4455;
      border-color: #ff99aa;
    }
    /* 按钮激活状态：背景色更深，文字颜色更浅，边框颜色更深 */
    nav.category-nav button.active,
    nav.sort-nav button.active {
      background-color: #ffbfd1;
      color: #a6314b;
      border-color: #ff85a2;
    }

    /* ==================== 文章卡片基础样式 ==================== */
    /* 卡片通用样式：白色背景，圆角，阴影，溢出隐藏，弹性布局 */
    .card {
      background: #fff; /* 白色背景 */
      border-radius: 14px; /* 圆角 */
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1); /* 阴影增强层次感 */
      margin-bottom: 25px; /* 卡片间间距 */
      overflow: hidden; /* 内容溢出隐藏 */
      display: flex; /* 弹性布局 */
      text-decoration: none; /* 移除链接下划线 */
      color: inherit; /* 继承父级文字颜色 */
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 悬停动画 */
    }
    /* 卡片悬停效果：轻微上移+放大 */
    .card:hover {
      transform: translateY(-4px) scale(1.01);
    }

    /* 卡片封面图：占满宽度，固定高度，覆盖模式，左侧圆角与卡片一致 */
    .card img {
      width: 100%; /* 宽度占满 */
      object-fit: cover; /* 覆盖模式保持比例 */
      flex-shrink: 0; /* 不允许缩小 */
      border-radius: 14px 0 0 14px; /* 左侧圆角与卡片一致 */
    }

    /* 卡片内容区域：弹性布局，垂直排列子元素，最小高度保证内容显示 */
    .card-content {
      padding: 14px; /* 内边距 */
      flex: 1; /* 占据剩余空间 */
      display: flex; /* 弹性布局 */
      flex-direction: column; /* 子元素垂直排列 */
      min-height: 120px; /* 最小高度防止内容过短 */
    }

    /* ==================== 标题样式（关键：确保至少显示两行） ==================== */
    /* 标题样式：字号、字重、行高、溢出控制 */
    .card-title {
      font-size: 21px; /* 电脑端标题字号 */
      font-weight: 600; /* 粗体 */
      margin: 0 0 6px 0; /* 底部间距避免与日期重叠 */
      color: #222; /* 深灰色文字 */
      display: -webkit-box; /* 启用WebKit弹性盒模型 */
      -webkit-box-orient: vertical; /* 垂直排列 */
      -webkit-line-clamp: 1; /* 强制显示1行（兼容旧版） */
      line-clamp: 1; /* 标准属性（现代浏览器） */
      overflow: hidden; /* 超出内容隐藏 */
      line-height: 1.4; /* 行高适配两行显示 */
      /* 注：实际通过JS计算高度确保至少显示两行，此处CSS为备用 */
    }

    /* ==================== 日期样式（辅助信息） ==================== */
    /* 日期样式：小字号、浅灰色、紧凑间距 */
    .card-date {
      font-size: 9px; /* 小字号 */
      color: #888; /* 浅灰色 */
      margin: 0 0 8px 0; /* 与简介的间距 */
      letter-spacing: 0.5px; /* 字母间距更清晰 */
    }

    /* ==================== 摘要样式（关键：限制最多三行） ==================== */
    /* 摘要样式：字号、行高、溢出滚动 */
    .card-summary {
      font-size: 14px; /* 中等字号 */
      color: #555; /* 中灰色 */
      margin: 0 0 1px 0; /* 与分类栏的极小间距 */
      line-height: 1.5; /* 舒适行高 */
      overflow-y: auto; /* 超出内容滚动 */
      max-height: 4.5em; /* 最大高度（3行×1.5em） */
      scrollbar-width: thin; /* 细滚动条 */
      scrollbar-color: #ff7da1 #f0f0f0; /* 自定义滚动条颜色 */
    }
    /* 滚动条轨道样式 */
    .card-summary::-webkit-scrollbar {
      width: 6px; /* 滚动条宽度 */
    }
    .card-summary::-webkit-scrollbar-track {
      background: #f0f0f0; /* 轨道背景 */
      border-radius: 3px; /* 轨道圆角 */
    }
    .card-summary::-webkit-scrollbar-thumb {
      background: #ff7da1; /* 滑块颜色 */
      border-radius: 3px; /* 滑块圆角 */
    }

    /* ==================== 分类栏样式（关键：贴合下侧） ==================== */
    /* 分类栏样式：小字号、粉色、斜体、背景模糊，固定在内容区域底部 */
    .card-category {
      font-size: 10px; /* 极小字号 */
      color: #ff5d8c; /* 粉色文字 */
      font-style: italic; /* 斜体 */
      margin-top: auto; /* 弹性布局中自动置底 */
      padding: 1px 1px; /* 极小内边距 */
      backdrop-filter: blur(2px); /* 背景模糊 */
      -webkit-backdrop-filter: blur(2px); /* 兼容Safari */
      border-radius: 6px; /* 圆角 */
      background-color: rgba(255, 255, 255, 0.95); /* 半透明白色背景 */
      border: 1px solid rgba(255, 255, 255, 0.3); /* 半透明白色边框 */
      line-height: 1.0; /* 紧凑行高避免换行 */
      max-width: 100%; /* 防止文字溢出 */
      white-space: nowrap; /* 文字不换行 */
      overflow: hidden; /* 超出隐藏 */
      text-overflow: ellipsis; /* 超出显示省略号 */
      margin-bottom: 2px; /* 与卡片底部的极小间距 */
    }

    /* ==================== 电脑端细长卡片布局（封面在左，内容在右） ==================== */
    @media (min-width: 769px) {
      /* 卡片整体：固定高度，水平布局，圆角增大 */
      .card {
        flex-direction: row; /* 子元素水平排列 */
        height: 150px; /* 固定高度保证比例 */
        width: 760px; /* 略宽于内容区域 */
        margin: 0 auto 25px; /* 居中显示 */
        border-radius: 16px; /* 更大圆角 */
      }

      /* 封面图：宽度占比28%，高度占满卡片 */
      .card img {
        width: 28%; 
        height: 100%;
        border-radius: 16px 0 0 16px; /* 左侧圆角与卡片一致 */
      }

      /* 内容区域：宽度占比62%，内边距增大，垂直排列子元素 */
      .card-content {
        width: 62%;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* 子元素两端对齐 */
      }

      /* 标题：电脑端字号略小（适配宽度），强制显示1行（实际通过高度控制） */
      .card-title {
        font-size: 19px;
        -webkit-line-clamp: 1;
        line-clamp: 1;
      }

      /* 摘要：字号增大，最大高度增加，显示更多内容 */
      .card-summary {
        font-size: 10px;
        max-height: 5em; /* 3行×1.5em×1.1（行高） */
      }

      /* 内容区域底部内边距：为分类栏留出空间 */
      .card-content {
        padding-bottom: 14px;
      }
    }

    /* ==================== 移动端垂直卡片布局（封面在上，内容在下） ==================== */
    @media (max-width: 768px) {
      /* 卡片整体：垂直布局，宽度占满屏幕90%，高度自适应 */
      .card {
        flex-direction: column;
        height: auto;
        width: 90%;
        margin: 0 auto 20px;
        border-radius: 14px;
      }

      /* 封面图：高度增大突出封面，顶部圆角与卡片一致 */
      .card img {
        width: 100%;
        height: 220px;
        border-radius: 14px 14px 0 0;
      }

      /* 内容区域：内边距增大，底部圆角与卡片一致 */
      .card-content {
        padding: 20px;
        border-radius: 0 0 14px 14px;
      }

      /* 标题：移动端字号增大，强制显示2行 */
      .card-title {
        font-size: 19px;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      /* 日期：移动端字号增大更清晰 */
      .card-date {
        font-size: 10px;
      }

      /* 摘要：字号增大，行高更舒适，最大高度增加 */
      .card-summary {
        font-size: 13px;
        max-height: 5em;
        line-height: 1.6;
      }

      /* 分类栏：圆角增大，内边距增大，更贴合移动端 */
      .card-category {
        font-size: 11px;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 6px;
      }  
      /* 分类导航容器：允许按钮换行 */
        .category-nav {
            flex-wrap: wrap; /* 关键属性：允许按钮换行 */
            justify-content: center; /* 按钮水平居中 */
            gap: 8px; /* 按钮间间距 */
            padding: 4px 0; /* 增加内边距避免按钮贴边 */
        }

        /* 分类按钮：适配小屏幕 */
        .category-nav button {
            font-size: 0.75rem; /* 更小字体 */
            padding: 4px 8px; /* 减小内边距 */
            margin-right: 4px; /* 按钮间更小间隙 */
            border-radius: 12px; /* 更小圆角 */
            white-space: normal; /* 允许文本换行（防止单个按钮过长） */
        }

          /* 排序导航容器：调整间距 */
        .sort-nav {
            flex-wrap: wrap; /* 允许按钮换行 */
            justify-content: center; /* 按钮水平居中 */
            gap: 8px; /* 按钮间间距 */
            margin-top: 8px; /* 与分类导航的间距 */
        }

        /* 排序按钮：缩小字体，适配小屏幕 */
        .sort-nav button {
            font-size: 0.75rem; /* 更小字体 */
            padding: 4px 8px; /* 减小内边距 */
            border-radius: 12px; /* 更小圆角 */
        }

        /* 激活状态：增强对比度，确保可见 */
        nav button.active {
            background-color: #ff5d8c; /* 更深的粉色 */
            color: white; /* 白色文字 */
            border-color: #ff5d8c; /* 边框颜色同步 */
        }
        
    }
  </style>
</head>
<body>
  <header>
    <h1>🥥 Recto's Blog 🥥</h1>
  </header>

  <nav class="main-nav">
    <a href="/index.html" class="nav-link">首页</a>
    <a href="/articles.html" class="nav-link active">博客</a>
    <a href="/about.html" class="nav-link">关于</a>
    <a href="/guestbook.html" class="nav-link">留言</a>
  </nav>

<div id="controls" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
  <!-- 分类导航组 -->
  <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <span style="font-weight: 600; color: #a6314b; margin-bottom: 5px;">分类</span>
    <nav class="category-nav" id="categoryNav" style="margin-bottom: 0;">
      <button data-category="all" class="active">All</button>
      <!-- 动态分类按钮 -->
    </nav>
  </div>

  <!-- 排序导航组 -->
  <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <span style="font-weight: 600; color: #a6314b; margin-bottom: 5px;"> 排序</span>
    <nav class="sort-nav" id="sortNav" style="margin-bottom: 0;">
      <button data-order="desc" class="active">最新优先</button>
      <button data-order="asc">最旧优先</button>
    </nav>
  </div>
</div>

  <main class="container" id="articlesContainer">
    <p>⏳ 加载中...</p>
  </main>

  <script>
    /* 全局变量：存储所有文章数据、当前排序方式 */
    let allPosts = [];
    const container = document.getElementById('articlesContainer');
    const nav = document.getElementById('categoryNav');
    const sortNav = document.getElementById('sortNav');
    let currentSortOrder = 'desc'; // 默认最新优先

    /* 加载分类按钮：从API获取分类数据并生成导航按钮 */
    async function loadCategories() {
      try {
        const res = await fetch('/api/posts/categories'); // 获取分类接口
        const categories = await res.json(); // 解析JSON数据
        
        // 遍历分类生成按钮
        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.dataset.category = cat; // 存储分类值
          btn.textContent = cat; // 按钮显示分类名
          nav.appendChild(btn); // 添加到导航容器
        });
      } catch (err) {
        console.error('加载分类失败', err);
        // 加载失败时显示错误提示
        const errorTip = document.createElement('span');
        errorTip.textContent = '⚠️ 分类加载失败，请刷新重试';
        errorTip.style.color = '#d00';
        nav.appendChild(errorTip);
      }
    }

    /* 获取所有文章数据：从API获取并存储到全局变量 */
    async function fetchArticles() {
      try {
        const res = await fetch('/api/posts'); // 获取文章接口
        allPosts = await res.json(); // 解析JSON数据
        renderArticles('all'); // 初始渲染所有文章
      } catch (err) {
        console.error(err);
        // 加载失败时显示错误提示
        container.innerHTML = '<p>❌ 加载失败，请稍后重试</p>';
      }
    }

    /* 渲染文章卡片：根据分类和排序规则生成卡片DOM */
    function renderArticles(category) {
      container.innerHTML = ''; // 清空容器
      
      // 过滤文章：按分类筛选（category为'all'时不筛选）
      let filtered = allPosts;
      if (category !== 'all') {
        filtered = allPosts.filter(post => post.category === category);
      }

      // 无文章时显示提示
      if (filtered.length === 0) {
        container.innerHTML = '<p>暂无文章</p>';
        return;
      }

      // 按排序规则排序（currentSortOrder为'desc'时最新优先）
      filtered.sort((a, b) => {
        const t1 = new Date(a.createdAt); // 文章A的创建时间
        const t2 = new Date(b.createdAt); // 文章B的创建时间
        return currentSortOrder === 'desc' ? t2 - t1 : t1 - t2; // 降序或升序
      });

      // 遍历过滤后的文章生成卡片
      filtered.forEach(post => {
        const card = document.createElement('a'); // 卡片为链接
        card.className = 'card'; // 应用卡片样式
        card.href = `/post.html?id=${post._id}`; // 链接到文章详情页
        
        // 卡片HTML结构：封面图+内容区域（标题+日期+摘要+分类）
        card.innerHTML = `
          <img src="${post.coverImage}" alt="封面图" />
          <div class="card-content">
            <h3 class="card-title">${post.title}</h3>
            <p class="card-date">${new Date(post.createdAt).toLocaleDateString()}</p>
            <p class="card-summary">${post.summary}</p>
            <p class="card-category"><em>分类: ${post.category || '未分类'}</em></p>
          </div>
        `;
        
        container.appendChild(card); // 将卡片添加到容器
      });
    }

    /* 分类按钮点击事件：切换选中状态并重新渲染文章 */
    nav.addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') { // 仅处理按钮点击
        nav.querySelectorAll('button').forEach(btn => btn.classList.remove('active')); // 移除所有按钮的激活状态
        e.target.classList.add('active'); // 为当前按钮添加激活状态
        const category = e.target.dataset.category; // 获取选中的分类
        renderArticles(category); // 重新渲染对应分类的文章
      }
    });

    /* 排序按钮点击事件：切换选中状态并重新渲染文章 */
    if (sortNav) {
      sortNav.addEventListener('click', e => {
        if (e.target.tagName === 'BUTTON') { // 仅处理按钮点击
          sortNav.querySelectorAll('button').forEach(btn => btn.classList.remove('active')); // 移除所有按钮的激活状态
          e.target.classList.add('active'); // 为当前按钮添加激活状态
          currentSortOrder = e.target.dataset.order; // 更新当前排序方式
          const currentCategory = nav.querySelector('button.active').dataset.category; // 获取当前选中的分类
          renderArticles(currentCategory); // 重新渲染对应分类和排序的文章
        }
      });
    }

    // 初始化：加载分类数据并获取文章
    fetchArticles();
    loadCategories();
  </script>
</body>
</html>

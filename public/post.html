<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js 样式（GitHub VS Code 风格）-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <!-- Highlight.js 脚本 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  // 配置 marked 使用 highlight.js
  marked.setOptions({
    highlight: function(code, lang) {
      if (hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      } else {
        return hljs.highlightAuto(code).value;
      }
    }
  });

  // 启用全局高亮
  hljs.highlightAll();
</script>

  <style>
    /* 🌥️ 微型云朵样式 - 增强版 */
    .tiny-cloud {
  display: inline-block;
  width: 40px;
  height: 28px;
  margin-left: 8px;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32"><path d="M30,15 Q35,15 35,20 Q35,25 30,25 Q30,28 25,28 Q20,28 20,25 Q15,28 10,28 Q5,28 5,25 Q0,25 0,20 Q0,15 5,15 Q5,12 10,12 Q12,8 18,8 Q24,8 26,12 Q30,12 30,15 Z" fill="%23c7e3ff"/><ellipse cx="10" cy="10" rx="5" ry="5" fill="%23c7e3ff"/><ellipse cx="20" cy="8" rx="6" ry="6" fill="%23c7e3ff"/><ellipse cx="29.1" cy="11" rx="5.0" ry="5.0" fill="%23c7e3ff"/></svg>') no-repeat center;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  vertical-align: middle;
  filter: drop-shadow(0 0 0 rgba(255, 102, 186, 0.295));
}

    .tiny-cloud:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 6px rgba(255, 102, 173, 0.23));
      animation: pulse-glow 1.5s infinite alternate;
    }

    @keyframes pulse-glow {
      0% {
        filter: drop-shadow(0 0 4px rgba(102, 176, 255, 0.4));
      }
      100% {
        filter: drop-shadow(0 0 8px rgba(102, 161, 255, 0.8));
      }
    }

    /* 🌧️ 小雨滴动画 - 多滴效果 */
    .tiny-cloud:hover::before,
    .tiny-cloud:hover::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 2px;
      height: 5px;
      background: #658cb4ca;
      border-radius: 70%;
      animation: drip 0.9s ease-out infinite;
    }

    .tiny-cloud:hover::before {
      left: 30%;
      animation-delay: 0s;
    }

    .tiny-cloud:hover::after {
      left: 55%;
      animation-delay: 0.4s;
    }

    @keyframes drip {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translateY(24px) scale(0.2);
        opacity: 0;
      }
    }

    /* 文章内容样式优化 */
    .markdown-body {
      line-height: 1.8;
      font-size: 1.1em;
      color: #444;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      padding-top: 10px; /* 单独设置顶部padding */
      padding-bottom: 20px; /* 底部留白高度（可调整） */
    }


    .markdown-body p {
      margin-bottom: 1.5em;
    }
    
    .post-footer {
      text-align: center;
      margin: 40px 0 30px;
      padding-top: 20px;
      border-top: 1px dashed rgba(0,0,0,0.1);
      color: #888;
      font-style: italic;
    }
    
    .post-meta {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      color: #777;
      font-size: 0.95em;
    }
    
    .category-label {
      background: rgba(128, 160, 192, 0.15);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 8px 20px;
      background: rgba(128, 160, 192, 0.1);
      border-radius: 20px;
      color: #668;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .back-link:hover {
      background: rgba(128, 160, 192, 0.2);
      transform: translateY(-2px);
    }

    /* 仅针对移动端的优化 */
    @media (max-width: 768px) {
      /* 封面图优化 */
      .post-cover {
        height: 220px !important;
        margin-bottom: 20px !important;
        border-radius: 0 !important;
      }

      .post-cover h1 {
        font-size: 1.6em !important;
        padding: 20px 15px !important;
      }

      /* 元信息优化 */
      .post-meta {
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 0.85em;
      }

      .markdown-body {
        font-size: 1em;
        padding: 0 15px;
        padding-top: 5px; /* 单独设置顶部padding */
        line-height: 1.7;
        padding-bottom: 15px;
}

      /* 返回链接优化 */
      .back-link {
        width: 80%;
        box-sizing: border-box;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🥥 Recto's Blog 🥥</h1>
  </header>

  <nav class="main-nav">
    <a href="/index.html" class="nav-link">首页</a>
    <a href="/articles.html" class="nav-link active">博客</a>
    <a href="/about.html" class="nav-link">关于</a>
    <a href="/guestbook.html" class="nav-link">留言</a>
  </nav>

  <div class="container" id="postContainer">
    <p style="text-align:center; margin: 40px 0;">⏳ 正在加载文章...</p>
  </div>

  <script>
    async function fetchPost() {
      const container = document.getElementById('postContainer');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        container.innerHTML = '<p class="error-msg">❌ 无效文章 ID</p>';
        return;
      }

      try {
        const res = await fetch(`/api/posts/${id}`);
        const post = await res.json();

        if (!post || !post.title) {
          container.innerHTML = '<p class="error-msg">❌ 未找到该文章</p>';
          return;
        }

        // 渲染文章内容
        container.innerHTML = `
          <article class="post-content">
            <div class="post-cover" style="
              height: 300px;
              background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.2)), 
                          url('${post.coverImage}') center/cover;
              border-radius: 12px;
              margin-bottom: 30px;
              position: relative;
              display: flex;
              align-items: flex-end;
              justify-content: center;
            ">
              <h1 style="
                color: white;
                text-shadow: 0 2px 8px rgba(0,0,0,0.5);
                padding: 30px;
                max-width: 800px;
                width: 100%;
                text-align: center;
                font-size: 2.2em;
                letter-spacing: 0.5px;
              ">${post.title}</h1>
            </div>

            <div class="post-meta">
              <span>📅 ${new Date(post.createdAt).toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
              })}</span>
              <span class="category-label">${post.category || '未分类'}</span>
              <span>读完约 ${Math.ceil(post.content.length / 500)} 分钟</span>
            </div>

            <div class="markdown-body">${marked.parse(post.content)}</div>
            
            <div class="post-footer">
              <p> <span class="tiny-cloud" title=""></span></p>
              <a href="/articles.html" class="back-link">← 返回文章列表</a>
            </div>
          </article>
        `;

      } catch (err) {
        console.error('加载失败:', err);
        container.innerHTML = `
          <div class="error-msg">
            <p>❌ 加载失败，请稍后重试</p>
            <p><small>${err.message || '网络请求异常'}</small></p>
            <a href="/articles.html" class="back-link">返回文章列表</a>
          </div>
        `;
      }
    }

    // 页面加载完成后获取文章
    window.addEventListener('DOMContentLoaded', fetchPost);

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>文章详情 - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- ❌ 删除 github-markdown.min.css 的引入 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
  <h1>🥥 Recto's Blog 🥥</h1>
</header>

<nav class="main-nav">
  <a href="/index.html" class="nav-link">首页</a>
  <a href="/articles.html" class="nav-link active">博客</a>
  <a href="/about.html" class="nav-link">关于我</a>
  <a href="/guestbook.html" class="nav-link">留言板</a>
</nav>


  <div class="container" id="postContainer">
    <p>⏳ 正在加载文章...</p>
  </div>

  <script>
    async function fetchPost() {
      const container = document.getElementById('postContainer');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        container.innerHTML = '<p>❌ 无效文章 ID</p>';
        return;
      }

      try {
        const res = await fetch(`/api/posts/${id}`);
        const post = await res.json();

        if (!post || !post.title) {
          container.innerHTML = '<p>❌ 未找到该文章</p>';
          return;
        }

        container.innerHTML = `
  <h2 style="text-align:center;">${post.title}</h2>
  <p style="text-align:center; color: #999;">
    📅 ${new Date(post.createdAt).toLocaleDateString()}
    <span class="category-label">${post.category || '未分类'}</span>
  </p>
  <img src="${post.coverImage}" alt="封面图" style="max-width:100%; border-radius: 12px; margin: 20px auto; display: block;" />
  <div class="markdown-body">${marked.parse(post.content)}</div>
`;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p>❌ 加载失败，请稍后重试</p>';
      }
    }

    fetchPost();
  </script>
</body>
</html>

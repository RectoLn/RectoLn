<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板 - Recto's Blog</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    
    textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    textarea:focus, input:focus {
      outline: none;
      border-color: #ff7da1;
      box-shadow: 0 0 0 2px rgba(255, 125, 161, 0.2);
    }
    
    button {
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #ff7da1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover {
      background-color: #ff5d8c;
      transform: translateY(-1px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .message {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    
    .message:hover {
      transform: translateY(-2px);
    }
    
    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .message-name {
      font-weight: 600;
      color: #333;
    }
    
    .message-date {
      color: #999;
      font-size: 0.85rem;
    }
    
    .message-content {
      line-height: 1.6;
      color: #444;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    
    .error-state {
      text-align: center;
      padding: 20px;
      color: #e74c3c;
      background: #fde8e8;
      border-radius: 8px;
    }
    
    .char-counter {
      text-align: right;
      font-size: 0.8rem;
      color: #999;
      margin-top: 4px;
    }
    
    .btn-text {
      display: inline;
    }
    
    .btn-spinner {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥥 Recto's Blog 🥥</h1>
  </header>

  <nav class="main-nav">
    <a href="/index.html" class="nav-link">首页</a>
    <a href="/articles.html" class="nav-link">博客</a>
    <a href="/about.html" class="nav-link">关于</a>
    <a href="/guestbook.html" class="nav-link active">留言</a>
  </nav>

  <div class="container">
    <h2>留言板</h2>
    
    <div class="form-group">
      <label for="name">昵称</label>
      <input type="text" id="name" placeholder="选填" maxlength="20" />
    </div>
    
    <div class="form-group">
      <label for="message">留言内容</label>
      <textarea id="message" rows="5" placeholder="写下你想说的话..." maxlength="500"></textarea>
      <div class="char-counter"><span id="char-count">0</span>/500</div>
    </div>
    
    <button id="submitBtn">
      <span class="btn-text">提交留言</span>
      <span class="btn-spinner">发送中...</span>
    </button>

    <div id="messages">
      <div class="loading">加载留言中...</div>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const submitBtn = document.getElementById('submitBtn');
    const messageInput = document.getElementById('message');
    const charCount = document.getElementById('char-count');
    const nameInput = document.getElementById('name');

    // 实时字数统计
    messageInput.addEventListener('input', () => {
      charCount.textContent = messageInput.value.length;
    });

    // 格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      
      // 如果是今天，只显示时间
      if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString('zh-CN', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }
      
      // 如果是昨天
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      if (date.toDateString() === yesterday.toDateString()) {
        return '昨天 ' + date.toLocaleTimeString('zh-CN', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }
      
      // 其他情况显示完整日期
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 获取留言列表
    async function fetchMessages() {
      messagesDiv.innerHTML = '<div class="loading">加载留言中...</div>';
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) throw new Error('网络响应不正常');
        
        const data = await res.json();
        if (data.length === 0) {
          messagesDiv.innerHTML = `
            <div class="empty-state">
              <p>还没有留言哦~</p>
              <p>快来留下第一条吧！</p>
            </div>
          `;
          return;
        }
        
        messagesDiv.innerHTML = '';
        data.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'message';
          
          div.innerHTML = `
            <div class="message-header">
              <span class="message-name">${msg.name || '匿名'}</span>
              <span class="message-date">${formatDate(msg.createdAt)}</span>
            </div>
            <div class="message-content">${msg.content.replace(/\n/g, '<br>')}</div>
          `;
          messagesDiv.appendChild(div);
        });
      } catch (err) {
        messagesDiv.innerHTML = `
          <div class="error-state">
            <p>加载留言失败</p>
            <p><small>${err.message}</small></p>
          </div>
        `;
        console.error('加载留言失败:', err);
      }
    }

    // 提交留言
    async function submitMessage() {
      const name = nameInput.value.trim();
      const content = messageInput.value.trim();
      
      if (!content) {
        alert('请输入留言内容');
        messageInput.focus();
        return;
      }
      
      if (content.length > 500) {
        alert('留言内容不能超过500字');
        return;
      }
      
      // 显示加载状态
      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').style.display = 'none';
      submitBtn.querySelector('.btn-spinner').style.display = 'inline';
      
      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name || undefined, content }),
        });
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || '提交失败');
        }
        
        // 清空表单
        nameInput.value = '';
        messageInput.value = '';
        charCount.textContent = '0';
        
        // 重新加载留言
        await fetchMessages();
      } catch (err) {
        alert(err.message || '提交失败，请稍后重试');
        console.error('提交留言失败:', err);
      } finally {
        // 恢复按钮状态
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').style.display = 'inline';
        submitBtn.querySelector('.btn-spinner').style.display = 'none';
      }
    }

    // 事件监听
    submitBtn.addEventListener('click', submitMessage);
    
    // 按Enter键提交（Shift+Enter换行）
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    // 页面加载时获取留言
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
